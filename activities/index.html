<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activities — Language Bridge</title>
<meta name="description" content="Browse every Language Bridge activity: bilingual and ESL activities you can use with students in the next 10 minutes. Filter by grade, module, and content area.">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
<style>
  .filters { display:grid; gap:var(--sp-3); grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); align-items:end; margin-bottom:var(--sp-5); }
  .filters label { display:block; font-weight:600; font-size:.85rem; color:var(--navy); margin-bottom:.25rem; }
  .filters select { width:100%; font:inherit; padding:.5rem; border:2px solid #cdddf2; border-radius:10px; background:#fff; }
  .results { display:grid; gap:var(--sp-4); grid-template-columns:repeat(auto-fill,minmax(16rem,1fr)); }
  .a-card { display:flex; flex-direction:column; }
  .a-card .pad { flex:1; display:flex; flex-direction:column; gap:.5rem; }
  .a-card .meta { margin-top:auto; }
  .count { color:var(--ink-soft); font-size:.9rem; margin-bottom:var(--sp-3); }
</style>
</head>
<body data-nav="activities/">
<a class="skip-link" href="#main">Skip to content</a>
<div data-shell="header"></div>

<main class="main" id="main">
  <h1>Activities</h1>
  <p>Everything here is built to answer one question: <em>what can a teacher use with
     students in the next 10 minutes?</em> No accounts, works on a Chromebook, works on paper.</p>

  <div class="filters" aria-label="Filter activities">
    <div><label for="f-module">Module</label><select id="f-module"><option value="">All modules</option></select></div>
    <div><label for="f-grade">Grade</label><select id="f-grade"><option value="">Any grade</option>
      <option>K</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
    <div><label for="f-subject">Content area</label><select id="f-subject"><option value="">Any subject</option>
      <option value="elar">Reading / ELAR</option><option value="science">Science</option>
      <option value="math">Math</option><option value="social-studies">Social Studies</option><option value="slar">Spanish LA</option></select></div>
    <div><label for="f-time">Time</label><select id="f-time"><option value="">Any length</option>
      <option value="10">≤ 10 min</option><option value="20">≤ 20 min</option></select></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <div class="results" id="results"></div>
</main>

<div data-shell="footer"></div>

<script>window.LB_BASE = "../";</script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  var all = [], modules = {};
  function pick(o){ return I18n.pick(o, I18n.uiLang); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function render() {
    var m = document.getElementById("f-module").value;
    var g = document.getElementById("f-grade").value;
    var subj = document.getElementById("f-subject").value;
    var time = document.getElementById("f-time").value;
    var rows = all.filter(function (a) {
      if (m && a.module !== m) return false;
      if (g && a.grades.indexOf(g === "K" ? 0 : parseInt(g,10)) === -1) return false;
      if (subj && (a.subjects||[]).indexOf(subj) === -1) return false;
      if (time && a.duration > parseInt(time,10)) return false;
      return true;
    });
    document.getElementById("count").textContent = rows.length + (rows.length === 1 ? " activity" : " activities");
    document.getElementById("results").innerHTML = rows.map(function (a) {
      var modName = modules[a.module] ? pick(modules[a.module].name) : a.module;
      return '<div class="card a-card"><div class="pad">' +
        '<span class="chip">' + esc(modName) + '</span>' +
        '<h3 style="margin:.25rem 0 0">' + esc(pick(a.title)) + '</h3>' +
        '<p>' + esc(pick(a.studentGoal)).slice(0,120) + '…</p>' +
        '<div class="meta activity-meta">' +
          '<span class="chip">' + a.duration + ' min</span>' +
          '<span class="chip">Grade ' + a.grades.join(", ") + '</span>' +
          '<span class="chip">EN ↔ ' + a.supportedHomeLanguages.join(",").toUpperCase() + '</span>' +
        '</div>' +
        '<div class="row" style="margin-top:.6rem">' +
          '<a class="btn sm" href="../modules/' + esc(a.module) + '/activity.html?id=' + esc(a.id) + '">Teacher view</a>' +
          '<a class="btn sm secondary" href="../modules/' + esc(a.module) + '/activity.html?id=' + esc(a.id) + '&mode=student">Student</a>' +
        '</div></div></div>';
    }).join("");
  }

  window.LB.ready.then(function () {
    return fetch("../data/site.json").then(function (r){ return r.json(); });
  }).then(function (site) {
    var live = site.modules.filter(function (x){ return x.status === "live"; });
    var sel = document.getElementById("f-module");
    live.forEach(function (m){ modules[m.id] = m; var o=document.createElement("option"); o.value=m.id; o.textContent=pick(m.name); sel.appendChild(o); });
    return Promise.all(live.map(function (m){
      return fetch("../" + m.data).then(function (r){ return r.json(); }).then(function (d){ return d.activities||[]; });
    }));
  }).then(function (lists) {
    all = lists.reduce(function (acc,l){ return acc.concat(l); }, [])
      .filter(function (a){ return a.status !== "draft"; }); // drafts hidden until published
    ["f-module","f-grade","f-subject","f-time"].forEach(function (id){ document.getElementById(id).addEventListener("change", render); });
    document.addEventListener("lb:langchange", render);
    render();
  });
})();
</script>
</body>
</html>
