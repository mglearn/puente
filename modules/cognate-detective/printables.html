<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printable — Cognate or False Friend?</title>
<meta name="description" content="Printable version of the Cognate or False Friend? activity, generated from the same content record.">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/print.css">
<style>
  @media screen { body { background: #e9edf3; } } /* never on paper */
  .toolbar { text-align: center; padding: 1rem; }
  .toolbar button, .toolbar select {
    font: inherit; font-weight: 600; padding: .5rem 1rem; border-radius: 999px;
    border: 2px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer;
  }
  .toolbar select { background:#fff; color: var(--navy); }
</style>
</head>
<body>
<div class="toolbar no-print" role="region" aria-label="Print options" data-i18n-attr="aria-label:print.options">
  <label><span data-i18n="lang.label">Language</span>
    <select id="lang"><option value="en">English</option><option value="es">Español</option><option value="ar">العربية</option></select>
  </label>
  <label style="margin:0 1rem"><span data-i18n="print.sheet">Sheet</span>
    <select id="sheet">
      <option value="student" data-i18n="print.student_pack">Student pack</option>
      <option value="answer" data-i18n="print.answer_key">Answer key</option>
    </select>
  </label>
  <button type="button" id="btn-print" data-i18n="print.print">Print</button>
</div>

<main class="printable" id="printable"></main>

<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/printable.js"></script>
<script>
(function () {
  "use strict";
  var BASE = "../../";
  var MODULE = location.pathname.split("/").filter(Boolean).slice(-2)[0];
  var LANGS = ["en", "es", "ar"];
  var activity = null, moduleName = null, manifest = null;
  var params = new URLSearchParams(location.search);
  var sheet = params.get("sheet") === "answer" ? "answer" : "student";

  // Start in the language the teacher asked for (?lang=), else the site language
  // they last chose, else English.
  I18n.restore();
  var lang = params.get("lang") || I18n.uiLang;
  if (LANGS.indexOf(lang) === -1) lang = "en";

  function setLang(l) {
    lang = l;
    I18n.uiLang = l;                                  // I18n.t() strings follow the sheet language
    document.documentElement.setAttribute("lang", l);
    document.documentElement.setAttribute("dir", I18n.dir(l));
    I18n.apply();
    render();
  }

  function render() {
    if (!activity) return;
    document.getElementById("printable").innerHTML = Printable.render({
      activity: activity, sheet: sheet, moduleName: moduleName, manifest: manifest, base: BASE
    });
  }

  document.getElementById("lang").value = lang;
  document.getElementById("sheet").value = sheet;
  document.getElementById("lang").addEventListener("change", function (e) { setLang(e.target.value); });
  document.getElementById("sheet").addEventListener("change", function (e) { sheet = e.target.value; render(); });
  document.getElementById("btn-print").addEventListener("click", function () { window.print(); });

  I18n.basePath(BASE).load(LANGS).then(function () {
    return Promise.all([
      fetch(BASE + "modules/" + MODULE + "/data.json").then(function (r) { return r.json(); }),
      fetch(BASE + "data/site.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch(BASE + "data/image-manifest.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]);
  }).then(function (out) {
    var store = out[0];
    var mod = out[1] && (out[1].modules || []).filter(function (m) { return m.id === MODULE; })[0];
    moduleName = mod ? mod.name : null;
    manifest = out[2];
    var id = params.get("id") || "";
    activity = store.activities.filter(function (x) { return x.id === id; })[0] || store.activities[0];
    setLang(lang);
  });
})();
</script>
</body>
</html>
