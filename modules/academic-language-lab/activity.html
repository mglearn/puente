<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Language Lab — Language Bridge</title>
<meta name="description" content="Academic Language Lab activity: say it, explain it, support it, use it. Teacher view, student mode, and printable — no accounts, no data collected.">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/activities.css">
<link rel="stylesheet" href="../../assets/css/print.css">
<link rel="stylesheet" href="../../assets/css/rtl.css">
<style>
  /* Academic Language Lab secondary accent (spec §32: one accent per module) */
  body { --module-accent: var(--blue); }
  .mode-bar { position: sticky; top: 0; z-index: 20; background: var(--navy-tcea); color:#fff; }
  .mode-bar .bar { padding-block: var(--sp-2); }
  .teacher-panel .drawer { margin-top: var(--sp-3); }
</style>
</head>
<body data-nav="modules/" data-mode="teacher" data-support="medium">
<a class="skip-link" href="#main" data-i18n="skip.content">Skip to content</a>
<div data-shell="header"></div>

<!-- Mode + support controls -->
<div class="mode-bar no-print" role="region" aria-label="View and support controls" data-i18n-attr="aria-label:controls.region">
  <div class="bar">
    <div class="row">
      <span class="sr-only" data-i18n="mode.label">View</span>
      <div class="segmented" role="group" aria-label="View" data-i18n-attr="aria-label:mode.label">
        <button data-mode-btn="teacher" aria-pressed="true" data-i18n="mode.teacher">Teacher</button>
        <button data-mode-btn="student" aria-pressed="false" data-i18n="mode.student">Student</button>
      </div>
    </div>
    <div class="row teacher-only" style="margin-inline-start:auto">
      <span class="sr-only" data-i18n="support.label">Support level</span>
      <div class="segmented on-light" role="group" aria-label="Support level" data-i18n-attr="aria-label:support.label">
        <button data-support-btn="high" aria-pressed="false" data-i18n="support.high">More support</button>
        <button data-support-btn="medium" aria-pressed="true" data-i18n="support.medium">Some support</button>
        <button data-support-btn="light" aria-pressed="false" data-i18n="support.light">Independent</button>
      </div>
    </div>
  </div>
</div>

<main class="main narrow" id="main">
  <!-- STUDENT MODE: title, directions, interactive (spec §11) -->
  <section class="student-only">
    <div class="card"><div class="pad">
      <h1 id="s-title">Academic Language Lab</h1>
      <p id="s-directions" class="sub"></p>
      <div id="activity-root" class="activity"><!-- engine mounts here --></div>
      <!-- Student-mode print: the whole activity as a sheet, not just the current item -->
      <div id="print-sheet" class="print-only printable"></div>
    </div></div>
  </section>

  <!-- TEACHER MODE: full metadata + standards + launch (spec §11, §23) -->
  <section class="teacher-only">
    <div class="card"><div class="pad">
      <h1 id="t-title">Academic Language Lab</h1>
      <div class="activity-meta" id="t-meta"></div>

      <div class="teacher-panel stack" id="teacher-panel"></div>

      <div class="controls no-print" style="margin-top:var(--sp-5)">
        <button class="btn" id="btn-launch-student" data-i18n="mode.student">Student</button>
        <button class="btn secondary" id="btn-print" data-i18n="activity.print">Print this activity</button>
        <a class="btn secondary" id="btn-printable" href="printables.html?id=cog-context-3-5-001" target="_blank" rel="noopener" data-i18n="teacher.printables">Printable resources</a>
        <button class="btn secondary" id="btn-share" data-i18n="activity.student_link">Copy student link</button>
      </div>
      <p class="sr-only" id="share-status" role="status" aria-live="polite"></p>
      <p class="no-print" id="share-manual" hidden><label for="share-url"></label><br>
        <input id="share-url" type="text" readonly style="width:100%;font:inherit;padding:.4rem"></p>
    </div></div>
  </section>
</main>

<div data-shell="footer"></div>

<script>window.LB_BASE = "../../";</script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/feedback.js"></script>
<script src="../../assets/js/standards.js"></script>
<script src="../../assets/js/activity-engine.js"></script>
<script src="../../assets/js/printable.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  var BASE = window.LB_BASE;
  var params = new URLSearchParams(location.search);
  var wantId = params.get("id") || "";
  // Derive the module from this page's own path so the activity page is generic
  // across modules: /modules/<module>/activity.html
  var MODULE = location.pathname.split("/").filter(Boolean).slice(-2)[0];
  var activity = null, moduleName = null, manifest = null;

  function pick(o) { return I18n.pick(o, I18n.uiLang); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function setMode(mode) {
    document.body.setAttribute("data-mode", mode);
    document.querySelectorAll("[data-mode-btn]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-mode-btn") === mode ? "true" : "false");
    });
  }
  function setSupport(level) {
    document.body.setAttribute("data-support", level);
    document.querySelectorAll("[data-support-btn]").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-support-btn") === level ? "true" : "false");
    });
    document.dispatchEvent(new CustomEvent("lb:supportchange", { detail: { support: level } }));
  }

  function buildTeacher() {
    var a = activity;
    document.getElementById("t-title").textContent = pick(a.title);
    document.getElementById("s-title").textContent = pick(a.title);
    document.getElementById("s-directions").textContent = pick(a.studentDirections);
    // Tag fallback text with its real language (e.g. English under the Arabic UI).
    [["s-title", a.title], ["s-directions", a.studentDirections]].forEach(function (x) {
      var n = document.getElementById(x[0]), l = I18n.langOf(x[1]);
      if (l && l !== I18n.uiLang) { n.setAttribute("lang", l); n.setAttribute("dir", I18n.dir(l)); }
      else { n.removeAttribute("lang"); n.removeAttribute("dir"); }
    });

    document.title = pick(a.title) + " — " + I18n.t("site.name");

    // Meta chips
    document.getElementById("t-meta").innerHTML =
      chip(I18n.t("meta.minutes", { n: a.duration })) +
      chip(I18n.t("meta.grade", { g: Printable.gradeList(a.grades) })) +
      chip(a.targetLanguage.toUpperCase() + " ↔ " + a.supportedHomeLanguages.join(",").toUpperCase()) +
      chip(I18n.t("meta.interactive")) + chip(I18n.t("meta.printable"));

    var rows = "";
    rows += metaRow("teacher.objective", esc(pick(a.studentGoal)));
    rows += metaRow("teacher.function", esc(pick(a.languageFunction)));
    rows += metaRow("teacher.directions", esc(pick(a.teacherDirections)));
    rows += metaRow("teacher.student_dirs", esc(pick(a.studentDirections)));

    // Support options summary (spec §20)
    rows += metaRow("teacher.supports", ["high", "medium", "light"].map(function (lv) {
      return "<strong>" + esc(I18n.t("support." + lv)) + ":</strong> " + esc(I18n.t("support." + lv + "_desc"));
    }).join(" · "));

    // UDL + strategies + ACE/CLEAR (local frameworks, clearly labeled)
    rows += metaRow("teacher.udl", a.udl.map(esc).join("<br>"));
    rows += metaRow("teacher.strategies", a.strategies.map(esc).join(", "));
    rows += metaRow("framework.ace",
      '<span class="tag-local">' + esc([I18n.t("ace.articulate"), I18n.t("ace.connect"), I18n.t("ace.extend")].join(" · ")) +
      '</span><br><span style="font-size:.82rem;color:var(--ink-soft)">' +
      esc(I18n.t("framework.local_note")) + "</span>");
    if (a.clear && a.clear.enabled) {
      rows += metaRow("framework.clear",
        '<span class="tag-local">' + esc(I18n.t("framework.emphasis", { list: a.clear.emphasis.join(", ") })) + '</span>');
    }

    var panel = document.getElementById("teacher-panel");
    panel.innerHTML = '<dl style="margin:0">' + rows + '</dl>' +
      '<details class="drawer" open>' +
        '<summary>' + esc(I18n.t("teacher.standards")) + '</summary>' +
        '<div class="drawer-body">' + Standards.renderDrawer(a) + '</div>' +
      '</details>' +
      '<details class="drawer">' +
        '<summary>' + esc(I18n.t("teacher.answer")) + '</summary>' +
        '<div class="drawer-body">' + answerKey(a) + '</div>' +
      '</details>';
  }

  function answerKey(a) {
    var labelFor = function (it) {
      var pool = a.interactionType === "sort" ? a.categories : it.choices;
      var match = (pool || []).filter(function (c) { return c.id === it.answer; })[0];
      return match ? pick(match.label) : it.answer;
    };
    return '<ol style="padding-inline-start:1.2rem">' + a.items.map(function (it) {
      return '<li style="margin-bottom:.4rem"><strong>' + esc(pick(it.prompt)) + '</strong><br>✔ ' +
        esc(labelFor(it)) + '</li>';
    }).join("") + '</ol>';
  }

  function chip(t) { return '<span class="chip">' + esc(t) + '</span>'; }
  function metaRow(key, valueHtml) {
    return '<div class="meta-row"><dt data-i18n="' + key + '">' + esc(I18n.t(key)) + '</dt><dd>' + valueHtml + '</dd></div>';
  }

  function copied() {
    document.getElementById("share-manual").hidden = true;
    var status = document.getElementById("share-status");
    status.textContent = "";
    // Re-set after a tick so a repeated copy is announced again.
    setTimeout(function () { status.textContent = I18n.t("share.copied"); }, 50);
    var btn = document.getElementById("btn-share");
    btn.textContent = "✓ " + I18n.t("activity.student_link");
    setTimeout(function () { btn.textContent = I18n.t("activity.student_link"); }, 2000);
  }

  // Printing: the teacher view prints with every drawer open (closed <details>
  // hide their content on paper); student mode prints the full activity sheet
  // rather than only the item currently on screen.
  var reopen = [];
  window.addEventListener("beforeprint", function () {
    if (!activity) return;
    if (document.body.getAttribute("data-mode") === "student") {
      document.getElementById("print-sheet").innerHTML = Printable.render({
        activity: activity, sheet: "student", moduleName: moduleName, manifest: manifest, base: BASE
      });
    } else {
      reopen = [].slice.call(document.querySelectorAll("#teacher-panel details:not([open])"));
      reopen.forEach(function (d) { d.setAttribute("open", ""); });
    }
  });
  window.addEventListener("afterprint", function () {
    reopen.forEach(function (d) { d.removeAttribute("open"); });
    reopen = [];
  });

  function mountStudent() {
    var root = document.getElementById("activity-root");
    root.innerHTML = "";
    ActivityEngine.mount(root, activity);
  }

  function boot() {
    // Support/mode from URL (spec §11) — no student identifier is ever read.
    if (params.get("support")) setSupport(params.get("support"));
    if (params.get("mode")) setMode(params.get("mode"));

    // Point the printable link at the current activity.
    document.getElementById("btn-printable").setAttribute("href", "printables.html?id=" + activity.id);

    document.querySelectorAll("[data-mode-btn]").forEach(function (b) {
      b.addEventListener("click", function () { setMode(b.getAttribute("data-mode-btn")); });
    });
    document.querySelectorAll("[data-support-btn]").forEach(function (b) {
      b.addEventListener("click", function () { setSupport(b.getAttribute("data-support-btn")); });
    });
    document.getElementById("btn-launch-student").addEventListener("click", function () { setMode("student"); });
    document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
    document.getElementById("btn-share").addEventListener("click", function () {
      var url = location.origin + location.pathname + "?id=" + activity.id + "&mode=student&support=" +
        document.body.getAttribute("data-support");
      var write = navigator.clipboard && window.isSecureContext
        ? navigator.clipboard.writeText(url) : Promise.reject();
      write.then(copied, function () {
        // No async clipboard (http, older browser, permission denied): try the
        // legacy copy, and if that fails too, show the link to copy by hand.
        var ta = document.createElement("textarea");
        ta.value = url; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (err) {}
        document.body.removeChild(ta);
        if (ok) return copied();
        var box = document.getElementById("share-manual"), input = document.getElementById("share-url");
        box.querySelector("label").textContent = I18n.t("share.manual");
        input.value = url; box.hidden = false; input.focus(); input.select();
      });
    });

    buildTeacher();
    mountStudent();
    document.addEventListener("lb:langchange", function () { buildTeacher(); });
  }

  // Wait for app.js to finish loading locales + mounting the shell,
  // then load activity data and standards before booting the views.
  window.LB.ready.then(function () {
    return Promise.all([
      fetch(BASE + "modules/" + MODULE + "/data.json").then(function (r) { return r.json(); }),
      Standards.basePath(BASE).load(["elps", "teks-elar", "teks-slar"]),
      fetch(BASE + "data/image-manifest.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch(BASE + "data/site.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]);
  }).then(function (out) {
    var store = out[0];
    manifest = out[2];
    if (manifest) ActivityEngine.setManifest(manifest, BASE);
    var mod = out[3] && (out[3].modules || []).filter(function (m) { return m.id === MODULE; })[0];
    moduleName = mod ? mod.name : null;
    activity = (wantId && store.activities.filter(function (x) { return x.id === wantId; })[0]) || store.activities[0];
    boot();
  });
})();
</script>
</body>
</html>
