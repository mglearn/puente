<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE — Frameworks — Language Bridge</title>
<meta name="description" content="ACE (Articulate, Connect, Extend) is a local instructional overlay authored for Language Bridge — not a Texas Education Agency requirement.">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body data-nav="frameworks/">
<a class="skip-link" href="#main">Skip to content</a>
<div data-shell="header"></div>
<main class="main narrow" id="main">
  <p><a href="index.html">← Frameworks</a></p>
  <h1 id="fw-name">ACE</h1>
  <p id="fw-expansion" class="sub" style="color:var(--teal);font-weight:700"></p>
  <div class="panel accent"><p style="margin:0" id="fw-disclaimer"></p></div>
  <div id="fw-steps" class="stack" style="margin-top:var(--sp-5)"></div>
</main>
<div data-shell="footer"></div>

<script>window.LB_BASE = "../";</script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  "use strict";
  function pick(o){ return I18n.pick(o, I18n.uiLang); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  window.LB.ready.then(function () {
    return fetch("../data/frameworks/ace.json").then(function (r){ return r.json(); });
  }).then(function (f) {
    function draw() {
      document.getElementById("fw-name").textContent = f.name;
      document.getElementById("fw-expansion").textContent = f.expansion;
      document.getElementById("fw-disclaimer").innerHTML = '<span class="tag-local"></span> ' + esc(f.officialDisclaimer);
      document.getElementById("fw-steps").innerHTML = Object.keys(f.steps).map(function (k) {
        return '<div class="card"><div class="pad"><h3 style="text-transform:capitalize;margin:0 0 .3rem">' + esc(k) + '</h3>' +
          '<p style="margin:0">' + esc(pick(f.steps[k])) + '</p></div></div>';
      }).join("");
    }
    draw();
    document.addEventListener("lb:langchange", draw);
  });
})();
</script>
</body>
</html>
