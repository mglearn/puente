<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Language Bridge</title>
<meta name="robots" content="noindex">
<!-- Self-contained: GitHub Pages serves this for any missing path at any depth,
     so styles are inline and links are absolute to keep it working everywhere. -->
<style>
  :root{--navy:#082759;--blue:#1270C6;--teal:#147F84;--gold:#FCB040;--pale:#EEF4FC;--ink:#172033}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--pale);
       color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:1.5rem}
  .card{background:#fff;border-radius:18px;box-shadow:0 2px 24px rgba(8,39,89,.09);
        max-width:34rem;padding:clamp(1.5rem,5vw,3rem);text-align:center}
  .mark{width:64px;height:12px;border-radius:4px;margin:0 auto 1.25rem;
        background:linear-gradient(90deg,var(--navy),var(--blue) 45%,var(--teal) 75%,var(--gold))}
  h1{color:var(--navy);font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 .5rem}
  p{margin:0 0 1.5rem}
  a.btn{display:inline-block;font-weight:600;text-decoration:none;background:var(--blue);color:#fff;
        padding:.6rem 1.2rem;border-radius:999px;margin:.25rem}
  a.btn.secondary{background:#fff;color:var(--navy);border:2px solid #cdddf2}
  a{color:var(--blue)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>We couldn't find that page</h1>
    <p>The link may be old or mistyped. Language Bridge has no accounts and collects no data —
       so nothing is lost. Here's the way back.</p>
    <p>
      <a class="btn" href="/puente/">Home</a>
      <a class="btn secondary" href="/puente/activities/">Browse activities</a>
      <a class="btn secondary" href="/puente/modules/">Modules</a>
    </p>
  </main>
</body>
</html>
